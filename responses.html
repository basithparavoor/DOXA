<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responses | DOXA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="components.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Kanban Board Styles */
        .kanban-board { display: none; gap: 24px; overflow-x: auto; padding-bottom: 24px; align-items: flex-start; }
        .kanban-board.active { display: flex; }
        .kanban-column { flex: 0 0 320px; background: var(--bg-surface-hover); border-radius: var(--radius-lg); padding: 16px; border: 1px solid var(--border-light); min-height: 400px; }
        .kanban-header { font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); }
        .kanban-count { background: #e2e8f0; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }
        .kanban-cards { min-height: 350px; }
        
        .kanban-card { background: #fff; padding: 16px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); margin-bottom: 12px; cursor: grab; transition: transform 0.2s, box-shadow 0.2s; }
        .kanban-card:active { cursor: grabbing; transform: scale(0.98); }
        .kanban-card.dragging { opacity: 0.5; }
        .kanban-column.drag-over { background: #e2e8f0; border: 2px dashed var(--primary); }
        
        .card-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; color: var(--text-main); }
        .card-meta { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img id="globalSidebarLogo" src="logo.png" alt="Logo" style="height: 28px; object-fit: contain;">
                <span>DOXA ADMIN</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="programmes.html" class="nav-item"><i data-lucide="folder-kanban"></i> Programmes</a>
                <a href="forms.html" class="nav-item"><i data-lucide="file-text"></i> Forms</a>
                <a href="responses.html" class="nav-item active"><i data-lucide="inbox"></i> Responses</a>
                <a href="files.html" class="nav-item"><i data-lucide="folder-open"></i> File Manager</a>
                <a href="analytics.html" class="nav-item"><i data-lucide="bar-chart-2"></i> Analytics</a>
                <div style="margin: 16px 0; border-bottom: 1px solid var(--border-light);"></div>
                <a href="staff.html" class="nav-item"><i data-lucide="users"></i> Staff</a>
                <a href="settings.html" class="nav-item"><i data-lucide="settings"></i> Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i data-lucide="search" style="color: var(--text-light); width: 16px;"></i>
                    <input type="text" id="searchInput" placeholder="Search Registration ID...">
                </div>
            </header>

            <div class="page-content">
                <div class="page-header">
                    <div class="page-title">
                        <h1>Responses & Registrations</h1>
                    </div>
                    <div class="page-actions">
                        <!-- View Toggles -->
                        <div style="display: flex; background: var(--bg-surface-hover); border-radius: var(--radius-md); border: 1px solid var(--border-light); padding: 4px; margin-right: 12px;">
                            <button id="viewTableBtn" class="btn btn-outline" style="border: none; background: #fff; box-shadow: var(--shadow-sm);"><i data-lucide="list"></i> Table</button>
                            <button id="viewBoardBtn" class="btn btn-outline" style="border: none;"><i data-lucide="kanban"></i> Board</button>
                        </div>
                        <button class="btn btn-outline" id="exportBtn"><i data-lucide="download"></i> Export CSV</button>
                    </div>
                </div>

                <!-- Filters -->
                <div style="display: flex; gap: 12px; margin-bottom: 20px; background: var(--bg-surface); padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--border-light);">
                    <select id="filterProgramme" class="form-control" style="max-width: 250px;"><option value="ALL">All Programmes</option></select>
                    <select id="filterForm" class="form-control" style="max-width: 250px;"><option value="ALL">All Forms</option></select>
                    <select id="filterStatus" class="form-control" style="max-width: 200px;">
                        <option value="ALL">All Statuses</option>
                        <option value="SUBMITTED">Submitted</option>
                        <option value="UNDER_REVIEW">Under Review</option>
                        <option value="APPROVED">Approved</option>
                        <option value="REJECTED">Rejected</option>
                    </select>
                </div>

                <!-- Table View -->
                <div class="table-container" id="tableView">
                    <table class="data-table" id="responsesTable">
                        <thead id="responsesTableHead"></thead>
                        <tbody id="responsesTableBody"><tr><td colspan="5" style="text-align: center;">Loading...</td></tr></tbody>
                    </table>
                </div>

                <!-- Kanban Board View -->
                <div class="kanban-board" id="boardView">
                    <div class="kanban-column" data-status="SUBMITTED">
                        <div class="kanban-header">Submitted <span class="kanban-count" id="count_SUBMITTED">0</span></div>
                        <div class="kanban-cards" id="col_SUBMITTED"></div>
                    </div>
                    <div class="kanban-column" data-status="UNDER_REVIEW">
                        <div class="kanban-header" style="color: #F59E0B;">Under Review <span class="kanban-count" id="count_UNDER_REVIEW">0</span></div>
                        <div class="kanban-cards" id="col_UNDER_REVIEW"></div>
                    </div>
                    <div class="kanban-column" data-status="APPROVED">
                        <div class="kanban-header" style="color: #10B981;">Approved <span class="kanban-count" id="count_APPROVED">0</span></div>
                        <div class="kanban-cards" id="col_APPROVED"></div>
                    </div>
                    <div class="kanban-column" data-status="REJECTED">
                        <div class="kanban-header" style="color: #EF4444;">Rejected <span class="kanban-count" id="count_REJECTED">0</span></div>
                        <div class="kanban-cards" id="col_REJECTED"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- View Modal -->
    <div class="modal-overlay" id="viewModal">
        <div class="modal-card" style="max-width: 600px;">
            <div class="modal-header">
                <h2 id="modalRegId">Registration Details</h2>
                <button class="modal-close" id="closeViewModalBtn"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body" id="modalAnswersBody" style="max-height: 60vh; overflow-y: auto;"></div>
            <div class="modal-footer" style="justify-content: space-between; align-items: center;">
                <button class="btn btn-outline" id="deleteResponseBtn" style="color: var(--danger); border-color: var(--danger);"><i data-lucide="trash-2"></i> Delete</button>
                <div style="display:flex; align-items:center; gap: 12px;">
                    <select id="statusSelect" class="form-control" style="width: auto; padding: 6px 12px;">
                        <option value="SUBMITTED">Submitted</option><option value="UNDER_REVIEW">Under Review</option>
                        <option value="APPROVED">Approved</option><option value="REJECTED">Rejected</option>
                    </select>
                    <button class="btn btn-primary" id="saveStatusBtn">Update</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './config.js';

        const ResponsesAPI = {
            async getAll() {
                const { data, error } = await supabase.from('responses').select('id, registration_id, status, submitted_at, data, form_id, programme_id, forms ( title, schema ), programmes ( name )').order('submitted_at', { ascending: false });
                if (error) throw error; return data;
            },
            async updateStatus(responseId, newStatus) {
                const { error } = await supabase.from('responses').update({ status: newStatus }).eq('id', responseId);
                if (error) throw error; return true;
            },
            async delete(responseId) {
                const { error } = await supabase.from('responses').delete().eq('id', responseId);
                if (error) throw error; return true;
            }
        };

        function getFieldMap(schema) {
            const map = {};
            if (schema && schema.fields) schema.fields.forEach(f => { if (f.id && f.type !== 'section') map[f.id] = f.label; });
            return map;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            
            let currentResponses = [];
            let filteredResponses = [];
            let activeResponseId = null;
            let currentMode = 'table'; // table or board

            const filterProg = document.getElementById('filterProgramme');
            const filterForm = document.getElementById('filterForm');
            const filterStatus = document.getElementById('filterStatus');
            const searchInput = document.getElementById('searchInput');

            async function loadResponses() {
                try {
                    currentResponses = await ResponsesAPI.getAll();
                    filteredResponses = [...currentResponses];
                    populateDropdowns();
                    renderView();
                } catch (error) { console.error(error); }
            }

            function populateDropdowns() {
                const uniqueProgs = [...new Map(currentResponses.map(item => [item.programme_id, { id: item.programme_id, name: item.programmes?.name }])).values()];
                const uniqueForms = [...new Map(currentResponses.map(item => [item.form_id, { id: item.form_id, title: item.forms?.title }])).values()];

                filterProg.innerHTML = '<option value="ALL">All Programmes</option>';
                uniqueProgs.forEach(p => { if(p.id) filterProg.innerHTML += `<option value="${p.id}">${p.name || 'Unknown'}</option>`; });

                filterForm.innerHTML = '<option value="ALL">All Forms</option>';
                uniqueForms.forEach(f => { if(f.id) filterForm.innerHTML += `<option value="${f.id}">${f.title || 'Unknown'}</option>`; });
            }

            function applyFilters() {
                const progVal = filterProg.value; const formVal = filterForm.value; const statVal = filterStatus.value; const searchVal = searchInput.value.toLowerCase();
                filteredResponses = currentResponses.filter(r => {
                    const matchProg = progVal === 'ALL' || r.programme_id === progVal;
                    const matchForm = formVal === 'ALL' || r.form_id === formVal;
                    const matchStat = statVal === 'ALL' || r.status === statVal;
                    const matchSearch = r.registration_id.toLowerCase().includes(searchVal);
                    return matchProg && matchForm && matchStat && matchSearch;
                });
                renderView();
            }

            filterProg.addEventListener('change', applyFilters); filterForm.addEventListener('change', applyFilters);
            filterStatus.addEventListener('change', applyFilters); searchInput.addEventListener('input', applyFilters);

            // --- VIEW TOGGLES ---
            document.getElementById('viewTableBtn').addEventListener('click', (e) => {
                currentMode = 'table';
                e.currentTarget.style.background = '#fff'; e.currentTarget.style.boxShadow = 'var(--shadow-sm)';
                document.getElementById('viewBoardBtn').style.background = 'transparent'; document.getElementById('viewBoardBtn').style.boxShadow = 'none';
                document.getElementById('tableView').style.display = 'block'; document.getElementById('boardView').classList.remove('active');
                renderView();
            });

            document.getElementById('viewBoardBtn').addEventListener('click', (e) => {
                currentMode = 'board';
                e.currentTarget.style.background = '#fff'; e.currentTarget.style.boxShadow = 'var(--shadow-sm)';
                document.getElementById('viewTableBtn').style.background = 'transparent'; document.getElementById('viewTableBtn').style.boxShadow = 'none';
                document.getElementById('tableView').style.display = 'none'; document.getElementById('boardView').classList.add('active');
                renderView();
            });

            function renderView() {
                if (currentMode === 'table') renderTable();
                else renderBoard();
            }

            // --- TABLE LOGIC ---
            function renderTable() {
                const thead = document.getElementById('responsesTableHead');
                const tbody = document.getElementById('responsesTableBody');
                thead.innerHTML = ''; tbody.innerHTML = '';
                
                if(filteredResponses.length === 0) {
                    thead.innerHTML = `<tr><th>Registration ID</th><th>Programme / Form</th><th>Submitted</th><th>Status</th><th>Actions</th></tr>`;
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No responses match filters.</td></tr>'; return;
                }

                if (filterForm.value === 'ALL') {
                    thead.innerHTML = `<tr><th>Registration ID</th><th>Programme / Form</th><th>Submitted</th><th>Status</th><th>Actions</th></tr>`;
                    filteredResponses.forEach(resp => {
                        const statusColors = { 'SUBMITTED': 'badge-warning', 'UNDER_REVIEW': 'badge-warning', 'APPROVED': 'badge-success', 'REJECTED': 'badge-danger' };
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><strong style="font-family: var(--font-mono); color: var(--primary);">${resp.registration_id}</strong></td>
                            <td><strong>${resp.forms?.title || 'Unknown Form'}</strong><br><span style="color: var(--text-muted); font-size: 0.75rem;">${resp.programmes?.name || ''}</span></td>
                            <td>${new Date(resp.submitted_at).toLocaleDateString()}</td>
                            <td><span class="badge ${statusColors[resp.status] || 'badge-warning'}">${resp.status.replace('_', ' ')}</span></td>
                            <td><button class="btn btn-outline view-btn" data-id="${resp.id}" style="padding: 4px 8px; font-size: 0.75rem;">Review</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    const formSchema = filteredResponses[0]?.forms?.schema;
                    const fieldMap = getFieldMap(formSchema);
                    const allKeys = Array.from(new Set(filteredResponses.flatMap(r => Object.keys(r.data || {}))));
                    
                    let thHtml = `<tr><th>Registration ID</th><th>Submitted</th><th>Status</th>`;
                    allKeys.slice(0, 4).forEach(k => thHtml += `<th>${fieldMap[k] || k}</th>`); // Show first 4 fields to avoid overflow
                    thHtml += `<th>Actions</th></tr>`;
                    thead.innerHTML = thHtml;

                    filteredResponses.forEach(resp => {
                        const statusColors = { 'SUBMITTED': 'badge-warning', 'UNDER_REVIEW': 'badge-warning', 'APPROVED': 'badge-success', 'REJECTED': 'badge-danger' };
                        let tdHtml = `
                            <td><strong style="font-family: var(--font-mono); color: var(--primary);">${resp.registration_id}</strong></td>
                            <td>${new Date(resp.submitted_at).toLocaleDateString()}</td>
                            <td><span class="badge ${statusColors[resp.status] || 'badge-warning'}">${resp.status.replace('_', ' ')}</span></td>
                        `;
                        allKeys.slice(0, 4).forEach(k => {
                            let val = resp.data ? resp.data[k] : '-';
                            if (typeof val === 'object') val = 'File Attached';
                            tdHtml += `<td>${val}</td>`;
                        });
                        tdHtml += `<td><button class="btn btn-outline view-btn" data-id="${resp.id}" style="padding: 4px 8px; font-size: 0.75rem;">Review</button></td>`;
                        const tr = document.createElement('tr'); tr.innerHTML = tdHtml; tbody.appendChild(tr);
                    });
                }
                document.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', (e) => openViewModal(e.target.closest('button').dataset.id)));
            }

            // --- KANBAN LOGIC ---
            function renderBoard() {
                const cols = ['SUBMITTED', 'UNDER_REVIEW', 'APPROVED', 'REJECTED'];
                cols.forEach(status => {
                    document.getElementById(`col_${status}`).innerHTML = '';
                    let count = 0;
                    filteredResponses.filter(r => r.status === status).forEach(resp => {
                        count++;
                        
                        // Extract a preview name/email if possible
                        const dataKeys = Object.keys(resp.data || {});
                        const nameKey = dataKeys.find(k => k.toLowerCase().includes('name'));
                        const emailKey = dataKeys.find(k => k.toLowerCase().includes('email'));
                        const previewStr = (resp.data && nameKey) ? resp.data[nameKey] : ((resp.data && emailKey) ? resp.data[emailKey] : 'No preview available');

                        const card = document.createElement('div');
                        card.className = 'kanban-card';
                        card.draggable = true;
                        card.dataset.id = resp.id;
                        card.innerHTML = `
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                                <span style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--primary); font-weight: 600;">${resp.registration_id}</span>
                                <span style="font-size: 0.7rem; color: var(--text-muted);">${new Date(resp.submitted_at).toLocaleDateString()}</span>
                            </div>
                            <div class="card-title">${resp.forms?.title || 'Unknown Form'}</div>
                            <div class="card-meta">"${previewStr}"</div>
                            <button class="btn btn-outline view-btn" data-id="${resp.id}" style="width:100%; padding: 4px; font-size: 0.75rem;">Review</button>
                        `;

                        // Drag events
                        card.addEventListener('dragstart', (e) => { card.classList.add('dragging'); e.dataTransfer.setData('id', resp.id); });
                        card.addEventListener('dragend', () => { card.classList.remove('dragging'); });

                        document.getElementById(`col_${status}`).appendChild(card);
                    });
                    document.getElementById(`count_${status}`).textContent = count;
                });
                document.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', (e) => openViewModal(e.target.closest('button').dataset.id)));
            }

            // Kanban Drop Zones
            document.querySelectorAll('.kanban-column').forEach(col => {
                col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drag-over'); });
                col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
                col.addEventListener('drop', async (e) => {
                    e.preventDefault(); col.classList.remove('drag-over');
                    const id = e.dataTransfer.getData('id');
                    const newStatus = col.dataset.status;
                    const resp = currentResponses.find(r => r.id === id);
                    if (resp && resp.status !== newStatus) {
                        try {
                            await ResponsesAPI.updateStatus(id, newStatus);
                            resp.status = newStatus; // Optimistic update
                            applyFilters(); // Re-render
                        } catch (err) { alert('Failed to move card: ' + err.message); }
                    }
                });
            });

            // --- MODAL LOGIC ---
            function openViewModal(id) {
                const resp = currentResponses.find(r => r.id === id);
                if (!resp) return;
                
                const fieldMap = getFieldMap(resp.forms?.schema);
                activeResponseId = id;
                document.getElementById('modalRegId').textContent = resp.registration_id;
                document.getElementById('statusSelect').value = resp.status;
                
                const bodyEl = document.getElementById('modalAnswersBody');
                bodyEl.innerHTML = '';
                
                if (resp.data) {
                    for (const [key, value] of Object.entries(resp.data)) {
                        const label = fieldMap[key] || key.replace('field_', 'Question ');
                        let displayVal = value;
                        if (typeof value === 'object' && value.path) {
                            displayVal = `<a href="${value.path}" target="_blank" style="color:var(--primary);"><i data-lucide="external-link" style="width:14px; vertical-align:middle;"></i> View Attachment</a>`;
                        } else if (Array.isArray(value)) {
                            displayVal = value.join(', ');
                        } else if (typeof value === 'string' && value.startsWith('data:image')) {
                            displayVal = `<img src="${value}" style="max-height: 100px; border: 1px solid var(--border-light); border-radius: 4px;">`;
                        }
                        
                        bodyEl.innerHTML += `
                            <div style="margin-bottom: 16px; border-bottom: 1px solid var(--border-light); padding-bottom: 12px;">
                                <div style="font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 4px;">${label}</div>
                                <div style="font-size: 1rem; color: var(--text-main);">${displayVal || '-'}</div>
                            </div>
                        `;
                    }
                }
                lucide.createIcons();
                document.getElementById('viewModal').classList.add('active');
            }

            document.getElementById('closeViewModalBtn').addEventListener('click', () => document.getElementById('viewModal').classList.remove('active'));

            document.getElementById('saveStatusBtn').addEventListener('click', async () => {
                if (!activeResponseId) return;
                const btn = document.getElementById('saveStatusBtn'); btn.disabled = true; btn.textContent = 'Saving...';
                try {
                    await ResponsesAPI.updateStatus(activeResponseId, document.getElementById('statusSelect').value);
                    document.getElementById('viewModal').classList.remove('active');
                    await loadResponses(); 
                } catch (error) { alert('Failed to update: ' + error.message); } 
                finally { btn.disabled = false; btn.textContent = 'Update'; }
            });

            document.getElementById('deleteResponseBtn').addEventListener('click', async () => {
                if (!activeResponseId) return;
                if (!confirm("Permanently delete this response?")) return;
                try {
                    await ResponsesAPI.delete(activeResponseId);
                    document.getElementById('viewModal').classList.remove('active');
                    await loadResponses();
                } catch (error) { alert('Failed to delete: ' + error.message); }
            });

            loadResponses();
        });

// Mobile Sidebar Toggle Logic
const mobileMenuBtn = document.getElementById('mobileMenuBtn');
const sidebar = document.querySelector('.sidebar');

if (mobileMenuBtn && sidebar) {
    mobileMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sidebar.classList.toggle('active');
    });

    // Close sidebar when tapping outside of it on mobile screens
    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 768 && sidebar.classList.contains('active')) {
            if (!sidebar.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
                sidebar.classList.remove('active');
            }
        }
    });
}

    </script>
</body>
</html>
