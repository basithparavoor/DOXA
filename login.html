<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization DOXA | Login</title>
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="brand-header">
                <!-- Replaced Lucide icon with default logo.png -->
                <img src="logo.png" alt="Organization Logo" style="height: 48px; width: auto; margin-bottom: 16px; object-fit: contain;">
                <h1>DOXA ADMIN</h1>
                <p>Secure access for authorized staff</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Work Email</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" required placeholder="admin@organization.com">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                </div>
                
                <div class="form-actions">
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <i data-lucide="arrow-right"></i>
                </button>
                <div id="errorMsg" class="error-msg"></div>
            </form>
        </div>
    </div>

    <script type="module" src="config.js"></script>
    <script type="module" src="auth.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
